<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b6aef">
    <meta name="description" content="한국 주요 신문사의 사설을 모아서 보는 앱">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>오늘의 사설</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #000;
        }

        .by-credit {
            font-size: 12px;
            color: #999;
            font-weight: 400;
            margin-left: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .date-time {
            font-size: 13px;
            color: #999;
        }

        .update-btn {
            background-color: #5b6aef;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .update-btn:hover {
            background-color: #4a57d9;
        }

        /* 신문사 섹션 */
        .newspaper-section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .section-date {
            font-size: 12px;
            color: #999;
        }

        /* 리스트 아이템 */
        .editorial-item {
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .editorial-item:last-child {
            border-bottom: none;
        }

        .editorial-item:hover {
            background-color: #fafafa;
        }

        .item-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #999;
        }

        .item-category {
            display: inline-block;
            background-color: #e8eaf6;
            color: #5b6aef;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
            line-height: 1.4;
            cursor: pointer;
            transition: color 0.2s;
        }

        .item-title:hover {
            color: #5b6aef;
        }

        .item-title a {
            text-decoration: none;
            color: inherit;
        }

        .item-summary {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* 로딩 및 에러 */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #d32f2f;
            background-color: #ffebee;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .header-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="header-left">
                <div class="header-title">오늘의 사설<span class="by-credit">_by.HJ</span></div>
            </div>
            <div class="header-right">
                <div class="date-time" id="dateTime"></div>
                <button class="update-btn" id="updateBtn">업데이트</button>
            </div>
        </div>

        <!-- 콘텐츠 -->
        <div id="content" class="loading">데이터를 불러오는 중...</div>
    </div>

    <script>
        // Service Worker 등록
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => {
                console.log('Service Worker 등록 실패:', err);
            });
        }

        // 날짜/시간 표시
        function displayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const date = String(today.getDate()).padStart(2, '0');
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const day = dayNames[today.getDay()];

            document.getElementById('dateTime').textContent = `${year}.${month}.${date} (${day})`;
        }

        // 사설 데이터 로드
        async function loadEditorials() {
            try {
                const response = await fetch('/api/editorials');
                if (!response.ok) throw new Error('데이터 로드 실패');

                const data = await response.json();
                displayEditorials(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">데이터를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</div>
                `;
                console.error('Error:', error);
            }
        }

        // 사설 표시
        function displayEditorials(editorials) {
            const contentDiv = document.getElementById('content');
            let html = '';

            const newspaperOrder = ['조선일보', '매일경제', '한겨레', '한국경제'];

            for (const newspaper of newspaperOrder) {
                const items = editorials[newspaper] || [];
                if (items.length === 0) continue;

                html += `
                    <div class="newspaper-section">
                        <div class="section-header">
                            <div class="section-title">■ ${newspaper}</div>
                            <div class="section-date">${new Date().toISOString().split('T')[0]} · ${items.length}건</div>
                        </div>
                `;

                for (const item of items) {
                    const itemDate = new Date().toISOString().split('T')[0];
                    html += `
                        <div class="editorial-item">
                            <div class="item-meta">
                                <span class="item-category">정치</span>
                                <span>${itemDate}</span>
                            </div>
                            <a href="${item.url}" target="_blank" class="item-title">${item.title}</a>
                            <div class="item-summary">${item.summary}</div>
                        </div>
                    `;
                }

                html += `
                    </div>
                `;
            }

            contentDiv.innerHTML = html;
        }

        // 초기화
        displayDate();
        loadEditorials();

        // 업데이트 버튼
        document.getElementById('updateBtn').addEventListener('click', () => {
            document.getElementById('content').innerHTML = '<div class="loading">데이터를 새로고침하는 중...</div>';
            loadEditorials();
        });
    </script>
</body>
</html>
