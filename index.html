<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>오늘의 사설</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#121722;--muted:#697386;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
body{min-height:100vh}
.app{max-width:760px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:20;padding:12px 14px 9px;background:rgba(244,245,247,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}
.brand-right{display:flex;align-items:center;gap:7px}
.date{font-size:11px;color:var(--muted)}
.sync{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:700;cursor:pointer}
main{padding:14px 14px 92px}
.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:13px;font-size:12px;color:var(--muted);line-height:1.55}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}
.section-title strong{font-size:14px}
.section-title span{font-size:11px;color:var(--muted)}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:7px;box-shadow:0 1px 5px #00000006;transition:transform .12s}
.card:active{transform:scale(.994)}
.card h3{font-size:14px;line-height:1.35;margin:5px 0 4px;letter-spacing:-.3px}
.meta{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:10px}
.summary{margin:0;color:#374151;font-size:11.5px;line-height:1.42}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.chosun{background:#1d4ed8}
.mk{background:#f59e0b}
.hankyung{background:#7c3aed}
.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:12px}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;text-align:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:540px){.brand h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>오늘의 사설</h1>
      <div class="brand-right">
        <span class="date" id="today"></span>
        <button class="sync" id="syncBtn">업데이트</button>
      </div>
    </div>
  </header>

  <main>
    <div class="notice">신문사별로 <b>최신 사설 3개</b>를 가져옵니다. 요약은 본문의 첫 문장이며, 카드를 누르면 원문이 새 창으로 열립니다.</div>
    <div id="content"><div class="empty">불러오는 중…</div></div>
  </main>

  <div class="footer">기사 전문은 언론사 저작권을 위해 앱에 싣지 않고 원문으로 연결합니다.</div>
</div>

<script>
// 글자 안의 특수문자를 안전하게 바꿔서 화면이 깨지지 않게 합니다
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 사설 하나를 카드 모양 HTML로 만듭니다
function card(a, paper) {
  return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
    <div class="meta"><i class="dot ${esc(paper.key)}"></i><b>${esc(paper.name)}</b><span>·</span><span>${esc(a.date)}</span></div>
    <h3>${esc(a.title)}</h3>
    <p class="summary">${esc(a.summary)}</p>
  </a>`;
}

// 신문사 하나의 묶음(제목 + 카드들)을 만듭니다
function section(paper) {
  const items = paper.items || [];
  const info = paper.error ? '불러오기 실패' : `${items[0]?.date || '자료 없음'} · ${items.length}건`;
  const body = items.length
    ? items.map(a => card(a, paper)).join('')
    : `<div class="empty">${paper.error ? '사설을 불러오지 못했습니다.<br>' + esc(paper.error) : '확인된 사설이 없습니다.'}</div>`;
  return `<section><div class="section-title"><strong>${esc(paper.name)}</strong><span>${esc(info)}</span></div>${body}</section>`;
}

// 서버(/api/editorials)에서 사설을 받아와 화면에 그립니다
async function load() {
  const box = document.getElementById('content');
  try {
    const r = await fetch('/api/editorials?ts=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '서버 오류');
    box.innerHTML = (j.papers || []).map(section).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">사설을 불러오지 못했습니다.<br>${esc(e.message)}</div>`;
  }
}

document.getElementById('syncBtn').onclick = async () => {
  const b = document.getElementById('syncBtn');
  b.disabled = true; b.textContent = '불러오는 중';
  await load();
  b.disabled = false; b.textContent = '업데이트';
};

document.getElementById('today').textContent =
  new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });

load();
</script>
</body>
</html>
